<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO - AJOUTER -->
    <meta name="description" content="Écoutez le Coran en streaming avec Quranstream. Créez vos playlists de sourates préférées.">
    <meta name="keywords" content="Coran, streaming, sourates, Islam, écoute, playlists">
    <meta name="author" content="Quranstream">

    <!-- Open Graph -->
    <meta property="og:title" content="Quranstream - Streaming du Coran">
    <meta property="og:description" content="Écoutez et organisez vos sourates préférées">
    <meta property="og:type" content="website">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quranstream">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="{% static 'myapp/manifest.json' %}">
    <link rel="apple-touch-icon" href="{% static 'myapp/icons/icon-192.png' %}">


    {% block heading %}
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #000000 !important;
            padding: 16px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd700 !important;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .navbar-brand:hover {
            opacity: 0.8;
        }

        .navbar-brand::before {
            font-size: 1.8rem;
            color: #ffd700;
        }

        .navbar-nav {
            gap: 8px;
        }

        .navbar-nav .nav-item {
            margin: 0;
        }

        .navbar-nav .nav-link {
            font-size: 0.95rem;
            font-weight: 600;
            color: #b3b3b3 !important;
            padding: 8px 16px !important;
            border-radius: 24px;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
        }

        .navbar-nav .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .navbar-nav .nav-link.active {
            color: #000000 !important;
            background-color: #ffd700;
        }

        .navbar-toggler {
            border: none;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .navbar-toggler:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .navbar-toggler:focus {
            box-shadow: none;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .navbar-toggler-icon {
            filter: invert(1);
            width: 24px;
            height: 24px;
        }

        .navbar-collapse {
            transition: all 0.3s ease;
        }

        @media (max-width: 991px) {
            .navbar {
                padding: 12px 16px;
            }

            .navbar-collapse {
                margin-top: 16px;
                background: #121212;
                border-radius: 8px;
                padding: 16px;
            }

            .navbar-nav {
                gap: 4px;
            }

            .navbar-nav .nav-link {
                padding: 12px 16px !important;
                border-radius: 8px;
            }
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .song-list h3 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .song-list img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .play-button {
            background-color: #ffd700;
            color: black;
            font-size: 1rem;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .play-button:hover {
            background-color: #b89e14;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #181818;
            color: white;
            font-size: 1rem;
        }

        select option {
            background-color: #333;
        }

        button {
            background-color: #ffd700;
            color: black;
            font-weight: bold;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        button:hover {
            background-color: #b89e14;
        }

        @media (max-width: 600px) {
            form select, form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">Audio_player</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Accueil</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'all_playlists' %}">Mes Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'create_playlist' %}">Créer une Playlist</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout_user' %}">Déconnexion</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login_user' %}">Se connecter</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register_user' %}">S'inscrire</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    {% block body %}

    {% endblock %}

    <!-- Scripts Bootstrap (OBLIGATOIRE pour le menu burger) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
