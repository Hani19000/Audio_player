{% extends 'main/base.html' %}

{% block heading %}
<title>Quranstream | Connexion</title>
<style>
    body {
        background: linear-gradient(180deg, #121212 0%, #000000 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .auth-container {
        max-width: 450px;
        margin: 0 auto;
        padding: 40px 24px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 48px;
    }

    .auth-logo-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, #ffd700 0%, #b89e14 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
    }

    .auth-logo-icon::before {
        content: '♫';
        font-size: 2.5rem;
        color: #000000;
    }

    .auth-title {
        font-size: 3rem;
        font-weight: 900;
        color: #ffffff;
        margin: 0 0 12px 0;
        letter-spacing: -0.04em;
        text-align: center;
    }

    .auth-subtitle {
        font-size: 1rem;
        color: #b3b3b3;
        margin: 0 0 40px 0;
        text-align: center;
    }

    .authentication-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: transparent;
        padding: 0;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-label {
        font-size: 0.875rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.02em;
    }

    .authentication-form input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #333333;
        border-radius: 8px;
        background-color: #121212;
        color: #ffffff;
        font-size: 1rem;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .authentication-form input:focus {
        outline: none;
        border-color: #ffd700;
        background-color: #181818;
    }

    .authentication-form input::placeholder {
        color: #6a6a6a;
    }

    .remember-forgot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: #b3b3b3;
        cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #ffd700;
    }

    .forgot-password {
        font-size: 0.875rem;
        color: #b3b3b3;
        text-decoration: underline;
        transition: color 0.2s;
    }

    .forgot-password:hover {
        color: #ffffff;
    }

    .authentication-form button {
        width: 100%;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 24px;
        background-color: #ffd700;
        color: #000000;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        letter-spacing: 0.5px;
        margin-top: 8px;
    }

    .authentication-form button:hover {
        background-color: #b89e14;
        transform: scale(1.02);
    }

    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 32px 0;
        color: #6a6a6a;
        font-size: 0.875rem;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #333333;
    }

    .divider span {
        padding: 0 16px;
    }

    .auth-footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 32px;
        border-top: 1px solid #282828;
    }

    .auth-footer-text {
        font-size: 0.875rem;
        color: #b3b3b3;
        margin: 0 0 12px 0;
    }

    .auth-footer-link {
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s;
    }

    .auth-footer-link:hover {
        color: #ffd700;
    }

    .welcome-back {
        text-align: center;
        padding: 16px;
        background: rgba(255, 215, 0, 0.1);
        border-radius: 8px;
        margin-bottom: 24px;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .welcome-back p {
        margin: 0;
        font-size: 0.875rem;
        color: #ffd700;
    }

    .error-message {
        background: rgba(255, 50, 50, 0.1);
        border: 1px solid rgba(255, 50, 50, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        color: #ff6b6b;
        font-size: 0.875rem;
        margin-bottom: 16px;
        display: none;
    }

    .error-message.show {
        display: block;
    }

    .social-login {
        margin-top: 24px;
    }

    .social-button {
        width: 100%;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 700;
        border-radius: 24px;
        background-color: transparent;
        color: #ffffff;
        border: 2px solid #535353;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
    }

    .social-button:hover {
        border-color: #ffffff;
        transform: scale(1.02);
    }

    .social-icon {
        font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .auth-container {
            padding: 24px 16px;
        }

        .auth-title {
            font-size: 2.5rem;
        }

        .auth-logo {
            margin-bottom: 32px;
        }

        .remember-forgot {
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }
    }

    @media (max-width: 480px) {
        .auth-container {
            padding: 16px 12px;
        }

        .auth-logo-icon {
            width: 60px;
            height: 60px;
        }

        .auth-logo-icon::before {
            font-size: 2rem;
        }

        .auth-title {
            font-size: 2rem;
        }

        .auth-subtitle {
            font-size: 0.875rem;
        }
    }
</style>
{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-logo">
        <div class="auth-logo-icon"></div>
        <h1 class="auth-title">Bon retour</h1>
        <p class="auth-subtitle">Connectez-vous pour continuer à écouter</p>
    </div>

    <form method="post" class="authentication-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input
                id="username"
                placeholder="Entrez votre nom d'utilisateur"
                type="text"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Mot de passe</label>
            <input
                id="password"
                placeholder="Entrez votre mot de passe"
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </div>

        <button type="submit">Se connecter</button>
    </form>

    <div class="auth-footer">
        <p class="auth-footer-text">Vous n'avez pas de compte ?</p>
        <a href="{% url 'register_user' %}" class="auth-footer-link">S'inscrire gratuitement</a>
    </div>
</div>

{% endblock %}
